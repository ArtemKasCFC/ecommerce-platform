spring.application.name=ecommerce-platform
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
aws.sns.product-notifications-topic-arn=arn:aws:sns:us-east-1:000000000000:product-notifications
aws.sqs.product-notifications-queue-url=http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/product-notifications-queue